services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mailpit
    container_name: kael-site

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    container_name: kael-mailpit

  sass:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    tty: true
    command: sh -c "npm install -g sass && sass --watch --poll sass/principal.scss:css/principal.css"
    container_name: kael-sass